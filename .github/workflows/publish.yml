name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails the release if pyproject.toml, uv.lock, manifest.json,
      # package.json and server.json don't all agree with the tag. Releases
      # 0.3.9-0.3.11 bumped only pyproject.toml, so the published extension
      # stayed on 0.3.8 and shipped without the Accessibility consent prompt
      # added in 0.3.10 (#32).
      - name: Check version consistency
        run: python scripts/check_versions.py "${{ github.ref_name }}"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            dist/* \
            --generate-notes
